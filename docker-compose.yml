version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nerlogix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nerlogix}
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-nerlogix}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-nerlogix_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SPRING_DATASOURCE_USERNAME:-nerlogix} -d ${POSTGRES_DB:-nerlogix}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
        VITE_GOOGLE_MAP_ID: ${VITE_GOOGLE_MAP_ID}
    container_name: nerlogix-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:mysql://gateway01.ap-northeast-1.prod.aws.tidbcloud.com:4000/sys?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-2LGgC98nsjSZmT8.root}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-BcWFcURse8dZ0qkb}
      - NERLOGIX_JWT_SECRET=${NERLOGIX_JWT_SECRET:-replace_with_a_secure_jwt_secret_at_least_32_chars_long}
      - NERLOGIX_CORS_ALLOWED_ORIGINS=${NERLOGIX_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080}
      - NERLOGIX_UPLOADS_DIR=${NERLOGIX_UPLOADS_DIR:-/app/uploads}
      - NERLOGIX_WEATHER_AUTO_FETCH=${NERLOGIX_WEATHER_AUTO_FETCH:-true}
      - NERLOGIX_SIMULATION_ENABLED=${NERLOGIX_SIMULATION_ENABLED:-true}
      - NERLOGIX_SIMULATION_TICK_MS=${NERLOGIX_SIMULATION_TICK_MS:-3000}
      - GOOGLE_ROUTES_API_KEY=${GOOGLE_ROUTES_API_KEY}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 3

volumes:
  postgres_data:
  uploads_data:
