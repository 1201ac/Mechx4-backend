version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_GOOGLE_MAP_ID: ${VITE_GOOGLE_MAP_ID:-}
    container_name: mechx4-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:mysql://gateway01.ap-northeast-1.prod.aws.tidbcloud.com:4000/sys?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-3KQW41Z7XRUm1xM.root}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-${SPRING_DATASOURCE_PASSWORD:-}}
      - MECHX4_JWT_SECRET=${MECHX4_JWT_SECRET:-${NERLOGIX_JWT_SECRET:-replace_with_a_secure_jwt_secret_at_least_32_chars_long}}
      - MECHX4_CORS_ALLOWED_ORIGINS=${MECHX4_CORS_ALLOWED_ORIGINS:-${NERLOGIX_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080}}
      - MECHX4_UPLOADS_DIR=${MECHX4_UPLOADS_DIR:-/app/uploads}
      - MECHX4_WEATHER_AUTO_FETCH=${MECHX4_WEATHER_AUTO_FETCH:-true}
      - MECHX4_SIMULATION_ENABLED=${MECHX4_SIMULATION_ENABLED:-false}
      - MECHX4_SIMULATION_TICK_MS=${MECHX4_SIMULATION_TICK_MS:-5000}
      - GOOGLE_ROUTES_API_KEY=${GOOGLE_ROUTES_API_KEY:-}
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 3

volumes:
  uploads_data:
