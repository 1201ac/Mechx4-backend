spring:
  application:
    name: nerlogix
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/nerlogix;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /swagger-ui.html

nerlogix:
  jwt:
    secret: ${NERLOGIX_JWT_SECRET:dev_secret_key_must_be_at_least_32_bytes_long_for_security_reasons_12345}
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
  weather:
    auto-fetch: ${NERLOGIX_WEATHER_AUTO_FETCH:true}
  simulation:
    enabled: ${NERLOGIX_SIMULATION_ENABLED:true}
    tick-ms: ${NERLOGIX_SIMULATION_TICK_MS:3000}
