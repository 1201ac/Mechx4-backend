spring:
  application:
    name: nerlogix
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /swagger-ui.html

nerlogix:
  jwt:
    secret: ${NERLOGIX_JWT_SECRET:dev_secret_key_must_be_at_least_32_bytes_long_for_security_reasons_12345}
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
  weather:
    auto-fetch: true
  simulation:
    enabled: true
    tick-ms: 3000
