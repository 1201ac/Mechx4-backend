services:
  - type: web
    name: nerlogix-backend
    region: singapore
    env: docker
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: NERLOGIX_JWT_SECRET
        sync: false
      - key: NERLOGIX_CORS_ALLOWED_ORIGINS
        value: "https://ner-logix-frontend.vercel.app"
      - key: NERLOGIX_SIMULATION_ENABLED
        value: "false"
      - key: NERLOGIX_SIMULATION_TICK_MS
        value: "5000"
